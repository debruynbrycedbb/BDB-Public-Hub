<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bryce de Bruyn · Websites and games, in focus</title>
  <meta name="description" content="The websites and browser games Bryce de Bruyn has designed and built. Scroll to rack focus through them, from close up to infinity.">
  <meta name="theme-color" content="#08090b">

  <!-- Google tag (GA4 G-KSHFJ2PBB5 via GTM-5NJ6FLJG), Consent Mode v2.
       Starts with cookies off: Google only gets anonymous, cookieless pings.
       "Accept" in the bar (js/consent.js) turns analytics cookies on. Ad storage stays off. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      wait_for_update: 500
    });
    try {
      if (localStorage.getItem('bdb-analytics') === 'granted') {
        gtag('consent', 'update', { analytics_storage: 'granted' });
      }
    } catch (e) {}
  </script>
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5NJ6FLJG"></script>
  <script>
    gtag('js', new Date());
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <a class="skip" href="#work">Skip to the list of work</a>

  <header class="hud hud--top">
    <p class="hud__name">Bryce de Bruyn</p>
    <p class="hud__readout" aria-hidden="true"><span data-readout-dist>0.35 m</span><span class="hud__sep">·</span><span data-readout-f>f/1.4</span></p>
    <div class="hud__right">
      <button class="hud__pause" type="button" data-pause aria-pressed="false">Pause motion</button>
      <a class="hud__link" href="#work">All work</a>
    </div>
  </header>

  <main>
    <section class="scroller" data-scroller aria-label="Scroll to focus through the work">
      <div class="stage" data-stage>
        <canvas class="bokeh" data-bokeh aria-hidden="true"></canvas>
        <div class="planes" data-planes></div>
        <div class="af" data-af aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="captions" data-captions></div>
        <canvas class="iris" data-iris aria-hidden="true"></canvas>
        <div class="grain" aria-hidden="true"></div>

        <nav class="scale" data-scale aria-label="Focus distance">
          <span class="scale__index" aria-hidden="true"></span>
          <ol class="scale__marks" data-scale-marks></ol>
        </nav>

        <p class="cue" data-cue aria-hidden="true"><span class="cue__ring"></span>Scroll to focus</p>
      </div>
    </section>

    <section class="work" id="work" aria-labelledby="work-title">
      <h2 id="work-title">All work</h2>
      <div data-work-list></div>
    </section>
  </main>

  <footer class="foot">
    <p>Bryce de Bruyn · Barcelona</p>
    <div class="foot__links">
      <a class="foot__link" href="privacy.html">Privacy &amp; cookies</a>
      <button class="foot__consent" type="button" data-consent-open>Cookie settings</button>
    </div>
  </footer>

  <script src="js/data.js?v=8"></script>
  <script src="js/main.js?v=8"></script>
  <script src="js/consent.js?v=8"></script>
</body>
</html>
